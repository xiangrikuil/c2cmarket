    CreateCarpoolListingRequest:
      type: object
      additionalProperties: false
      required: [productPlanId, ownerContactMethodId, cycleTerm, title, summary, accessArrangement, distributionMethod, distributionMethodNote, providesAdminAccount, regionCode, regionName, priceMonthlyCny, serviceMultiplier, dailyQuotaAmount, weeklyQuotaAmount, followsOfficialQuotaReset, vpsRegion, supportsMainlandChinaDirectConnection, openingChannelCode, paymentMethodCode, buyerSeatCapacity, activeBuyerMembers]
      properties:
        productPlanId:
          type: string
          format: uuid
        ownerContactMethodId:
          type: string
          format: uuid
          description: Owner-selected contact method. The platform freezes its current version only when an application is accepted.
        cycleTerm:
          $ref: "#/components/schemas/CarpoolCycleTermInput"
        title:
          type: string
          maxLength: 120
        summary:
          type: string
          maxLength: 2000
        accessArrangement:
          type: string
          description: Non-sensitive member/seat/off-platform access arrangement. Must not contain passwords, keys, tokens, sessions, cookies, or panel owner credentials.
          maxLength: 2000
        distributionMethod:
          type: string
          enum: [sub2api, other]
          description: Public listing distribution method. Describes whether the owner supports Sub2API-managed use or another off-platform arrangement.
        distributionMethodNote:
          type: string
          description: Public non-sensitive distribution note. Required when distributionMethod is other. Must not contain account credentials, panel URLs, passwords, keys, tokens, sessions, cookies, or owner credentials.
          maxLength: 500
        providesAdminAccount:
          type: boolean
          description: Whether the listing owner declares that administrator account access is provided. This is a public signal only and does not store credentials.
        regionCode:
          type: string
          description: Stable opening-region code selected by the owner. Custom region listings use `other`.
          maxLength: 64
        regionName:
          type: string
          description: Public opening-region display name. For custom regions this is the owner-provided region text.
          maxLength: 64
        sourceUrl:
          type: string
          format: uri
          description: Legacy optional source URL retained for compatibility. Current carpool publishing clients do not collect or require an external post.
        priceMonthlyCny:
          $ref: "#/components/schemas/DecimalString"
        serviceMultiplier:
          $ref: "#/components/schemas/DecimalString"
          pattern: '^1(?:\.0+)?$'
          description: System-fixed carpool multiplier. Clients must send 1; owners cannot edit it.
        dailyQuotaAmount:
          $ref: "#/components/schemas/DecimalString"
          description: Owner-declared per-seat daily quota amount. It uses the selected product plan quota label and unit.
        weeklyQuotaAmount:
          $ref: "#/components/schemas/DecimalString"
          description: Owner-declared per-seat weekly quota amount. Label and unit come from the selected product plan and are not accepted from the client.
        followsOfficialQuotaReset:
          type: boolean
          description: Whether the declared quota follows the official provider reset schedule.
        vpsRegion:
          type: string
          minLength: 1
          maxLength: 64
          description: Owner-declared VPS region free text. It is informational and is not a catalog filter.
        supportsMainlandChinaDirectConnection:
          type: boolean
          description: Whether the owner declares that the access path supports direct connection from mainland China.
        openingChannelCode:
          type: string
          enum: [web, ios_app_store, google_play, team_seat, other]
        customOpeningChannel:
          type: string
          minLength: 1
          maxLength: 64
          description: Required only when openingChannelCode is other.
        paymentMethodCode:
          type: string
          enum: [credit_card, virtual_card, apple_pay, google_pay, app_store_gift_card, google_play_gift_card, paypal, u_card, other]
        customPaymentMethod:
          type: string
          minLength: 1
          maxLength: 64
          description: Required only when paymentMethodCode is other.
        buyerSeatCapacity:
          type: integer
          minimum: 1
          description: Buyer seats only. Excludes the listing owner.
        activeBuyerMembers:
          type: integer
          minimum: 0
          description: Active buyer members only. Excludes the listing owner.
        riskAcknowledgement:
          $ref: "#/components/schemas/RiskAcknowledgement"
    CarpoolCycleTermInput:
      type: object
      additionalProperties: false
      required: [billingPeriod, noticeDays, exitPolicy, usageRules]
      properties:
        billingPeriod:
          type: string
          enum: [monthly, weekly, custom]
        cycleStartDay:
          type: integer
          minimum: 1
