  /api/v1/carpools:
    get:
      operationId: listCarpools
      tags: [Carpools]
      security: []
      summary: List active carpool listings.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive search across listing ID, title, summary, region, owner ID, and review reason before pagination.
        - name: productPlanIds
          in: query
          schema: { type: string }
          description: Comma-separated product-plan IDs applied before pagination.
        - name: region
          in: query
          schema: { type: string }
          description: Exact region code or display name applied before pagination.
        - name: statuses
          in: query
          schema: { type: string }
          description: Comma-separated listing statuses applied before pagination.
        - name: view
          in: query
          schema: { type: string, enum: [public, exceptions] }
          description: Optional public or exception projection applied before pagination.
        - name: risk
          in: query
          schema: { type: string, enum: [high] }
          description: Restrict results to listings requiring or mentioning risk acknowledgement.
        - name: sort
          in: query
          schema: { type: string, enum: [recommended, updated_desc, price_asc, seats_desc] }
          description: Stable server-side ordering. Recommended currently uses the updated-descending order.
        - name: none
          in: query
          schema: { type: string, enum: ["1"] }
          description: Return an empty page when a selected client filter has no server-side representation.
      responses:
        "200":
          description: Active carpool listings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolListingList"
        "422":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCarpool
      tags: [Carpools]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
