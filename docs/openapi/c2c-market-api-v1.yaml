          maxLength: 4000
          description: Required for `login_account`. Must be an initial buyer-specific password, not an owner/master account credential.
        instructions:
          type: string
          maxLength: 4000
          description: Optional usage note. Must not contain cookies, sessions, OAuth/access/refresh tokens, recovery codes, MFA codes, subscription links, proxy node links, query-string secrets, or owner/master credentials.
