        requestedResolution:
          type: string
          enum: [full_refund, partial_refund, other]
        requestedAmountCny:
          type: [string, "null"]
          pattern: '^[0-9]+(?:\.[0-9]{1,2})?$'
          description: Required only for partial_refund and must not exceed the API order amount.
        issueOccurredAt:
          type: [string, "null"]
          format: date-time
          description: Required for completed orders. The issue must have occurred during the frozen purchased-service validity period.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Immutable credential-free initial message.
        evidenceAssetIds:
          $ref: "#/components/schemas/DisputeEvidenceAssetIds"
    APIOrder:
      type: object
      additionalProperties: false
      description: API service order for either a free-amount API service purchase or a limited fixed quota offer. C2CMarket does not process payments, provide escrow, or proxy API calls. After the seller explicitly confirms off-platform payment, the seller may submit one buyer-specific credential or a previously encrypted buyer-specific credential may be bound to the order. Buyer/seller detail and action responses may include it; lists, admin summaries, public responses, events, notifications, and logs must not.
      required:
        - id
        - orderNo
        - purchaseKind
        - apiPurchaseIntentId
        - apiServiceId
        - buyerReputation
        - sellerReputation
        - status
        - disputeStatus
        - hasDisputeHistory
        - disputeNeedsAction
        - disputeResponseOverdue
        - disputeAvailableActions
        - serviceTitleSnapshot
        - serviceVersionSnapshot
        - billingModeSnapshot
        - quotaUsagePolicySnapshot
        - promptAuditEnabledSnapshot
        - amount
        - currency
        - selectedPaymentMethod
        - paymentWindowMinutesSnapshot
        - paymentExpiresAt
        - merchantConfirmOverdue
        - deliveryOverdue
        - commercialOutcome
        - canReportLatePayment
        - canOpenDispute
        - disputeEligibilityReason
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        orderNo:
          type: string
          pattern: '^API-[0-9]{8}-[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{10}$'
          description: Immutable public business number. The UUID remains the route and relation key.
        purchaseKind:
          type: string
          enum: [api_service, limited_quota_offer]
        apiPurchaseIntentId:
          type: string
          format: uuid
        apiServiceId:
          type: string
          format: uuid
        buyerUserId:
          type: string
          format: uuid
          description: Present on owner and administrator views.
        sellerUserId:
          type: string
          format: uuid
