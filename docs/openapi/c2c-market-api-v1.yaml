  /api/v1/api-services:
    get:
      operationId: listPublicAPIServices
      tags: [APIMarket]
      security: []
      summary: List orderable public API services.
      description: Returns API services that are approved, online, clear, accepting orders, have a valid 3-15 minute payment window, and have at least one enabled payment option. Public service reads do not process payment, proxy upstream calls, expose payment QR codes, or store/deliver credentials.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: paymentMethod
          in: query
          required: false
          schema:
            type: string
            enum: [wechat, alipay]
        - name: billingMode
          in: query
          required: false
          schema:
            type: string
            enum: [metered_usd_quota, fixed_package]
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: modelCatalogId
          in: query
          required: false
          description: Exact enabled model supported by the service.
          schema:
            type: string
        - name: distributionSystem
          in: query
          required: false
          schema:
            type: string
            enum: [sub2api, new_api_proxy, other]
        - name: maxCnyPerUsd
          in: query
          required: false
          description: Maximum accepted CNY price per USD allowance for metered services.
          schema:
            type: string
            pattern: '^\d+(\.\d+)?$'
        - name: minimumIntentCnyMax
          in: query
          required: false
          description: Maximum accepted minimum purchase amount in CNY.
          schema:
            type: string
            pattern: '^\d+(\.\d+)?$'
        - name: packageModelCatalogId
          in: query
          required: false
          schema:
            type: string
        - name: packageDurationDays
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 3, 7, 30]
        - name: packagePriceCnyMax
          in: query
          required: false
          description: Maximum total price for an enabled package with stock.
          schema:
            type: string
            pattern: '^\d+(\.\d+)?$'
        - name: packageMultiplierMax
          in: query
          required: false
          description: Maximum merchant multiplier for the selected package model.
          schema:
            type: string
            pattern: '^\d+(\.\d+)?$'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [updated_desc, price_asc, minimum_purchase_asc, package_price_asc]
            default: updated_desc
      responses:
        "200":
          description: Public API services.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAPIServiceList"
