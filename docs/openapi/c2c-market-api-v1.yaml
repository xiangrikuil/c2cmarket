components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: c2c_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    accountAppealCookie:
      type: apiKey
      in: cookie
      name: c2c_account_appeal
    accountAppealCSRF:
      type: apiKey
      in: header
      name: X-Account-Appeal-CSRF
    restrictedBusinessCookie:
      type: apiKey
      in: cookie
      name: c2c_restricted_business_session
    restrictedBusinessCSRF:
      type: apiKey
      in: header
      name: X-Restricted-Business-CSRF
    metricsBearer:
      type: http
      scheme: bearer
  parameters:
    SessionAudience:
      name: X-Session-Audience
      in: header
      required: false
      schema:
        type: string
        enum: [normal, restricted_business]
        default: normal
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"?[1-9][0-9]*"?$'
    IfMatchAllowZero:
      name: If-Match
      in: header
      required: true
      description: Use `"0"` when creating a resource whose operation explicitly supports first-write optimistic locking; otherwise use the current ETag version.
      schema:
        type: string
        pattern: '^"?(0|[1-9][0-9]*)"?$'
    ReviewTransactionType:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum: [carpool_membership, api_order]
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 20 and must be between 1 and 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor returned as nextCursor. Clients must pass it back unchanged and must not inspect its internal encoding.
      schema:
        type: string
    PromotionRewardPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PromotionRewardLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PromotionCouponStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [all, pending, available, used, expired, revoked]
        default: all
    AdminUserPage:
      name: page
      in: query
      required: false
      description: One-based administrator user-directory page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    AdminUserLimit:
      name: limit
      in: query
      required: false
      description: Administrator user-directory page size.
      schema:
        type: integer
        enum: [20, 50, 100]
        default: 20
    OwnerAPISalesView:
      name: salesView
      in: query
      required: false
      description: Owner sales lifecycle view. Defaults to active, which includes selling and upcoming services.
      schema:
        type: string
        enum: [active, expired, paused, draft, all]
        default: active
    FavoriteTargetType:
      name: targetType
      in: path
      required: true
      schema:
        type: string
        enum: [carpool, api_service, api-service]
    FavoriteTargetId:
      name: targetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: Problem Details error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RateLimited:
      description: Rate limit exceeded. Problem Details `code` is `RATE_LIMITED`.
      headers:
        Retry-After:
          schema:
            type: string
          description: Seconds until the current in-process rate-limit window resets when known.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    DecimalString:
      type: string
      pattern: '^[0-9]+(\.[0-9]{1,8})?$'
      maxLength: 32
    CountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
    SearchResult:
      type: object
      required: [id, type, title, subtitle, badge, to]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [官方价格, 车源, API 服务, 用户, 商户]
        title:
          type: string
        subtitle:
          type: string
          description: Public-safe summary. Must not contain contact values, hidden store-alias owner usernames, credentials, payment, escrow, guarantee, or fulfillment material.
        badge:
          type: string
        to:
          type: string
    SearchResultList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        nextCursor:
          type: [string, "null"]
    Notification:
      type: object
      required: [id, type, title, detail, targetType, targetId, to, unread, createdAt, time]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Business inbox category label. This is station-inbox metadata, not an external push channel.
        title:
          type: string
        detail:
          type: string
          description: Public-safe detail text. Must not contain contact values, credentials, tokens, sessions, cookies, or credential delivery material.
        targetType:
          type: string
        targetId:
          type: string
        to:
          type: string
        unread:
          type: boolean
        readAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        time:
          type: string
          format: date-time
    NotificationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: [string, "null"]
    NotificationReadAllResult:
      type: object
      required: [count, items]
      properties:
        count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
    NavigationBadgeRoleSummary:
      type: object
      required: [carpoolActions, apiOrderActions]
      properties:
        carpoolActions:
          type: integer
          minimum: 0
        apiOrderActions:
          type: integer
          minimum: 0
    NavigationBadgeAdminSummary:
      type: object
      required: [total, officialPrices, carpools, apiServices, feedbackTickets, reports]
      properties:
        total:
          type: integer
          minimum: 0
        officialPrices:
          type: integer
          minimum: 0
        carpools:
          type: integer
          minimum: 0
        apiServices:
          type: integer
          minimum: 0
        feedbackTickets:
          type: integer
          minimum: 0
        reports:
          type: integer
          minimum: 0
    NavigationBadgeSummary:
      type: object
      required: [generatedAt, notificationUnread, importantAnnouncementUnread, feedbackUnread, buyer, merchant, admin]
      properties:
        generatedAt:
          type: string
          format: date-time
        notificationUnread:
          type: integer
          minimum: 0
        importantAnnouncementUnread:
          type: integer
          minimum: 0
        feedbackUnread:
          type: integer
          minimum: 0
        buyer:
          $ref: "#/components/schemas/NavigationBadgeRoleSummary"
        merchant:
          $ref: "#/components/schemas/NavigationBadgeRoleSummary"
        admin:
          oneOf:
            - $ref: "#/components/schemas/NavigationBadgeAdminSummary"
            - type: "null"
    AnnouncementAudience:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [all, roles, specific_users]
        roles:
          type: array
          items:
            type: string
            enum: [buyer, merchant, admin]
        userIds:
          type: array
          description: Administrator-only explicit recipient identifiers; omitted from user and public responses.
          items:
            type: string
            format: uuid
    AnnouncementReceipt:
      type: object
      required: [announcementId, announcementVersion]
      properties:
        announcementId:
          type: string
          format: uuid
        announcementVersion:
          type: integer
        firstSeenAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
        dismissedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: string
          format: date-time
