openapi: 3.1.0
info:
  title: C2CMarket API
  version: 0.1.0
  summary: Backend contract foundation and official price lead slice.
  description: |
    This contract covers the first executable backend slice. C2CMarket is a price intelligence
    and community matching platform. It does not process payments, escrow funds, store third-party
    general-purpose credentials, store plaintext native passwords, process payments, or proxy buyer
    API traffic. Sellers may optionally provide one encrypted, low-privilege credential used only by
    the platform health probe, or pre-import encrypted buyer-specific API quota credentials; neither
    credential class is exposed by public APIs. Buyer-specific credentials remain unavailable until
    the seller explicitly confirms off-platform payment. Native C2CMarket account passwords are stored
    only as salted hashes.
servers:
  - url: http://localhost:8080
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      security: []
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      tags: [System]
      security: []
      summary: Check process and configured database readiness.
      responses:
        "200":
          description: Ready, or no database configured for the local in-memory slice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Database or migration readiness failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /version:
    get:
      operationId: getVersion
      tags: [System]
      security: []
      summary: Return non-sensitive release and migration metadata.
      responses:
        "200":
          description: Build identity for the running backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /metrics:
    get:
      operationId: getMetrics
      tags: [System]
      security:
        - metricsBearer: []
      summary: Return Prometheus metrics for an authenticated monitoring collector.
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/dev-session:
    post:
      x-dev-only: true
      operationId: createDevSession
      tags: [DevAuth]
      security: []
      summary: Create a local development session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username:
                  type: string
                  maxLength: 64
                admin:
                  type: boolean
      responses:
        "200":
          description: Development session.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/dev-persona-session:
    post:
      x-dev-only: true
      operationId: createDevPersonaSession
      tags: [DevAuth]
      security: []
      summary: Prepare and sign in as a fixed local development persona.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevPersonaSessionRequest"
      responses:
        "200":
          description: Prepared development persona and normal session.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevPersonaSessionResponse"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [Auth]
      description: Returns the server-authoritative session expiry and rotates the CSRF token. This endpoint does not count as user activity for sliding renewal.
      responses:
        "200":
          description: Current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/restricted-business/session:
    get:
      operationId: getRestrictedBusinessSession
      tags: [Auth]
      security:
        - restrictedBusinessCookie: []
      summary: Read the current restricted-business session.
      description: Rotates only the restricted-business CSRF token. It never reads or falls back to the normal or account-appeal cookie.
      responses:
        "200":
          description: Current restricted-business session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/restricted-business/logout:
    post:
      operationId: logoutRestrictedBusinessSession
      tags: [Auth]
      security:
        - restrictedBusinessCookie: []
          restrictedBusinessCSRF: []
      summary: Revoke only the current restricted-business session.
      responses:
        "204":
          description: Restricted-business session revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/me/account-governance/business-center:
    get:
      operationId: getAccountGovernanceBusinessCenter
      tags: [Account governance]
      summary: Read the authenticated user's governance business center.
      description: Accepts either a normal session or a restricted-business session selected with `X-Session-Audience`. Action codes are server-computed and no new contact details are returned.
      security:
        - sessionCookie: []
        - restrictedBusinessCookie: []
      parameters:
        - $ref: "#/components/parameters/SessionAudience"
      responses:
        "200":
          description: Account-governance disposition projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountGovernanceBusinessCenter"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/password/login:
    post:
      operationId: loginWithPassword
      tags: [Auth]
      security: []
      summary: Log in with a native C2CMarket username and password.
      description: |
        Requires a fresh Turnstile token with action `password_login`, then creates the same cookie-backed session as OAuth login. Password credentials are stored as salted hashes and are intended to support native website accounts alongside linux.do OAuth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: Authenticated session.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          description: Turnstile verification failed.
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/password/reauthenticate:
    post:
      operationId: reauthenticatePassword
      tags: [Auth]
      summary: Reauthenticate the current session for a declared purpose.
      description: Verifies the current native password. With `grant_admin`, it creates a ten-minute, session-bound, single-use administrator grant; an omitted purpose retains the linux.do-link compatibility fact.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReauthenticateRequest"
      responses:
        "204":
          description: Current session recently reauthenticated.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/password:
    post:
      operationId: setBackupPassword
      tags: [Auth]
      summary: Set or change the current user's backup password.
      description: |
        Requires the cookie session and CSRF token. Accounts created through linux.do OAuth can set a backup password without a current password; accounts with an existing backup password must provide the current password. Plaintext passwords are never stored or returned.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "204":
          description: Backup password configured.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/password-reset/start:
    post:
      operationId: startPasswordReset
      tags: [Auth]
      security: []
      summary: Request a student-email password reset code.
      description: |
        Requires a fresh Turnstile token with action `password_reset`. The response is intentionally generic and does not reveal whether the canonical email belongs to an eligible student account. Only immutable student-email claims for active, suspended, or banned accounts are eligible; archived or security-locked accounts and accounts without a student-email claim receive the same accepted response without delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetStartRequest"
      responses:
        "202":
          description: Request accepted regardless of account existence or eligibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetStartResponse"
        "403":
          description: Turnstile verification failed.
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [Auth]
      security: []
      summary: Confirm a student-email password reset.
      description: |
        Validates the latest purpose-bound, single-use reset code and atomically replaces the Argon2id password, consumes the challenge, revokes normal and restricted-business sessions, increments the user version, and records a non-sensitive domain event. It does not change account governance state, create a session, or revoke account-appeal sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Password replaced and eligible sessions revoked. No session is created.
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/email-registration/config:
    get:
      operationId: getStudentEmailRegistrationConfig
      tags: [Auth]
      security: []
      summary: Return the public student-email registration switch and enabled exact institution domains.
      responses:
        "200":
          description: Public registration configuration. The backend still rechecks the switch and exact domain at both start and confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentRegistrationPublicConfig"
  /api/v1/auth/username-availability:
    get:
      operationId: getUsernameAvailability
      tags: [Auth]
      security: []
      summary: Check whether a valid public username is currently available.
      description: This result is advisory. Account creation still enforces the database uniqueness constraint.
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9_-]{3,24}$'
      responses:
        "200":
          description: "Current username availability. Reserved usernames return `available: false`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameAvailability"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/email-registration/start:
    post:
      operationId: startEmailRegistration
      tags: [Auth]
      security: []
      summary: Start student-email registration.
      description: |
        Requires a fresh Turnstile token with action `student_signup`, the persistent global switch to be enabled, and an exact enabled institution domain. A new six-digit challenge invalidates any earlier active registration challenge for the same canonical email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRegistrationStartRequest"
      responses:
        "200":
          description: Verification challenge created and sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailRegistrationStartResponse"
        "403":
          description: Turnstile verification failed or student registration is disabled.
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/email-registration/confirm:
    post:
      operationId: confirmEmailRegistration
      tags: [Auth]
      security: []
      summary: Confirm student-email registration and create a restricted buyer account.
      description: |
        Rechecks the persistent switch and exact enabled institution domain, consumes a purpose-bound single-use verification challenge, and atomically creates the user, immutable student-email claim, Argon2id password credential, registration attribution, safe identity event, and cookie session. The resulting account receives only `api_order.create` until linux.do is explicitly linked after password reauthentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRegistrationConfirmRequest"
      responses:
        "200":
          description: Student buyer account and session created.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "403":
          description: Student registration is disabled or the exact institution domain is no longer eligible.
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/oauth/start:
    get:
      operationId: startOAuthLogin
      tags: [Auth]
      security: []
      summary: Start OAuth login.
      parameters:
        - name: purpose
          in: query
          required: false
          description: "`link_linuxdo` starts identity linking; `restricted_business` uses a dedicated one-time state and resolves only an existing suspended or banned identity; `grant_admin_reauth` uses its own state bound to the current administrator session."
          schema:
            type: string
            enum: [link_linuxdo, restricted_business, grant_admin_reauth]
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: utmSource
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: utmMedium
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: utmCampaign
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: referrerHost
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
        - name: landingPath
          in: query
          required: false
          schema:
            type: string
            maxLength: 160
      responses:
        "200":
          description: OAuth authorization URL.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStartResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/account-appeal/start:
    get:
      operationId: startAccountAppealVerification
      tags: [Auth]
      security: []
      summary: Start linux.do verification for a restricted-account appeal.
      description: |
        Starts account-appeal OAuth with a dedicated one-time state and Cookie. It may resolve only
        an existing linux.do identity and cannot consume normal-login, restricted-business,
        identity-linking, or administrator-reauthentication state.
        It never creates or updates a user, registration attribution, referral reward, ordinary
        session, profile, or last-login fact.
      responses:
        "200":
          description: Purpose-scoped OAuth authorization URL.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStartResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/oauth/callback:
    get:
      operationId: completeOAuthLogin
      tags: [Auth]
      security: []
      summary: Complete OAuth login callback.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Ordinary login sets the normal session cookie and redirects to the original return path. The account-appeal purpose sets only the dedicated fixed-expiry appeal cookie and redirects to `/account-appeal` with a generic outcome hint.
          headers:
            Set-Cookie:
              schema:
                type: string
            Location:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      operationId: logoutSession
      tags: [Auth]
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Logged out.
        "403":
          $ref: "#/components/responses/Problem"
  /api/v1/account-appeal/session:
    get:
      operationId: getAccountAppealSession
      tags: [AccountAppeals]
      security:
        - accountAppealCookie: []
      summary: Read the fixed-expiry restricted-account appeal session.
      description: Rotates the dedicated CSRF token without renewing the 15-minute session expiry.
      responses:
        "200":
          description: Current restricted-account appeal session.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAppealSessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/account-appeal/appeals:
    post:
      operationId: createAccountGovernanceAppeal
      tags: [AccountAppeals]
      security:
        - accountAppealCookie: []
          accountAppealCSRF: []
      summary: Submit one account-governance appeal for the verified restricted account.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountGovernanceAppealRequest"
      responses:
        "201":
          description: Account-governance appeal submitted.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountGovernanceAppeal"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/search:
    get:
      operationId: searchMarket
      tags: [Search]
      security: []
      summary: Search public market resources.
      description: Aggregates only public-safe official price records, active carpools, public API services, public users, and public-profile merchants. It does not expose contact values, credentials, hidden store-alias owner mappings, payment, escrow, guarantee, or fulfillment data.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: paymentMethod
          in: query
          required: false
          description: Optional payment-method filter. Public lists return only currently orderable API services.
          schema:
            type: string
            enum: [wechat, alipay]
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Public search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultList"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/me/profile:
    get:
      operationId: getMyProfile
      tags: [Profiles]
      responses:
        "200":
          description: Current user's editable profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
    patch:
      operationId: updateMyProfile
      tags: [Profiles]
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyProfileRequest"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
  /api/v1/me/api-payment-settings:
    get:
      operationId: getMyAPIAccountPaymentSettings
      tags: [Profiles]
      summary: Get the current user's account-level API payment settings.
      description: Returns normalized WeChat Pay and Alipay settings. A user without saved settings receives both methods disabled instead of a not-found response.
      responses:
        "200":
          description: Current account-level API payment settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIAccountPaymentSettings"
        "401":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateMyAPIAccountPaymentSettings
      tags: [Profiles]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Replace the current user's account-level API payment settings.
      description: Exactly one of WeChat Pay or Alipay must be enabled. Saved inactive method details may be retained for a later switch. New API services copy the current setting as a service snapshot; this endpoint does not mutate existing services or orders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAPIAccountPaymentSettingsRequest"
      responses:
        "200":
          description: Updated account-level API payment settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIAccountPaymentSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/me/reputation:
    get:
      operationId: getMyReputation
      tags: [Reputation]
      summary: Get all buyer/seller and overall/carpool/API reputation snapshots.
      responses:
        "200":
          description: Six current versioned reputation snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyReputationResponse"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/me/email-verification/start:
    post:
      operationId: startEmailVerification
      tags: [Profiles]
      summary: Start email binding verification for the current user.
      description: |
        Sends a one-time verification code through the configured email sender. Development and test environments may expose `devCode` for local automation; production must use a provider and must not log or return plaintext credentials.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartEmailVerificationRequest"
      responses:
        "200":
          description: Verification challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartEmailVerificationResponse"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/me/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      tags: [Profiles]
      summary: Confirm an email verification code and bind the email.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailVerificationRequest"
      responses:
        "200":
          description: Updated profile with verified email state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/me/contact-methods:
    get:
      operationId: listMyContactMethods
      tags: [ContactMethods]
      responses:
        "200":
          description: Current user's contact methods with masked values only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMethodList"
  /api/v1/me/merchant-profile:
    get:
      operationId: getMyMerchantProfile
      tags: [Profiles]
      responses:
        "200":
          description: Current user's merchant profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantProfile"
