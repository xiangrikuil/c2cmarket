  /api/v1/api-services/{id}/purchase-intents:
    post:
      operationId: createAPIPurchaseIntent
      tags: [APIPurchaseIntents]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Submit an API service purchase intent and view the merchant contact.
      description: |
        Creates a non-payment purchase intent for off-platform confirmation. Only an orderable API service can receive new intents: approved, online, clear, accepting orders, valid payment window, and at least one enabled payment option. The owner has pre-consented to receive compliant intents and disclose the selected merchant contact to the successful buyer. The disclosure writes an API purchase intent contact access audit log with request ID and side metadata, without storing plaintext contact values. Purchase-intent creation does not store credentials, deliver keys, or proxy API traffic.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIPurchaseIntentRequest"
      responses:
        "201":
          description: Purchase intent created. The response includes the frozen merchant contact and must be served with Cache-Control private, no-store.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `private, no-store` because this response contains a full contact value.
            Location:
              schema:
                type: string
              description: Buyer detail URL for the created purchase intent.
            ETag:
              schema:
                type: string
              description: Version ETag for follow-up versioned actions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPIPurchaseIntentResponse"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/api-quota-sale-slots:
    get:
      operationId: listAPIQuotaSystemSaleSlots
      tags: [APIMarket]
      security: []
      summary: List the platform's fixed API quota sale slots.
      description: Returns the 20:00 Asia/Shanghai slot for each of seven Beijing calendar days. The server owns slot dates, registration cutoff, sale window, and current state.
      responses:
        "200":
          description: Fixed sale slots and the authoritative server time used for countdown display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIQuotaSystemSaleSlotList"
  /api/v1/api-quota-offers:
    get:
      operationId: listPublicAPIQuotaOffers
      tags: [APIMarket]
      security: []
      summary: List limited API quota offers.
      description: Lists seller-declared fixed USD allowance offers. C2CMarket does not issue or verify the upstream allowance and does not proxy API traffic.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: distributionSystem
          in: query
          required: false
          schema:
            type: string
            enum: [sub2api, new_api_proxy, other]
        - name: modelCatalogId
          in: query
          required: false
          description: Exact enabled model supported by the offer's API service.
          schema:
            type: string
        - name: oneMultiplier
          in: query
          required: false
          schema:
            type: boolean
        - name: maxMultiplier
          in: query
          required: false
          description: Maximum model multiplier accepted by the buyer.
          schema:
            type: string
            pattern: '^\d+(\.\d+)?$'
        - name: onlyOrderable
          in: query
          required: false
          schema:
            type: boolean
        - name: saleMode
          in: query
          required: false
          schema:
            type: string
            enum: [continuous, scheduled]
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [updated_desc, unit_price_asc, allowance_desc, delivery_asc]
            default: updated_desc
        - name: slotKey
          in: query
          required: false
          description: Stable Beijing slot key returned by `/api/v1/api-quota-sale-slots`.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}@(09|13|20):00$'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: excludeSystemSlots
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Limited API quota offer cards with server-derived orderability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAPIQuotaOfferList"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/api-quota-offers/{id}:
    get:
      operationId: getPublicAPIQuotaOffer
      tags: [APIMarket]
      security: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Limited API quota offer detail.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAPIQuotaOffer"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/api-quota-offers/{id}/orders:
    post:
      operationId: createAPIQuotaOrder
      tags: [APIOrders]
      security:
        - sessionCookie: []
          csrfToken: []
      summary: Create an order for one fixed limited API quota offer.
      description: Price, USD allowance, multiplier, expiry, service experience declaration, delivery mode, and payment window are read and frozen by the server. Scheduled offers require the active saleRoundId and use a five-minute payment window; continuous offers use ten minutes.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIQuotaOrderRequest"
      responses:
        "201":
          description: Limited quota order created atomically with inventory, round claim, and optional credential reservation.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIOrder"
        "409":
          description: Offer not started, round ended, sold out, buyer round limit reached, credential unavailable, or batch expired. Inspect the stable Problem Details code.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
