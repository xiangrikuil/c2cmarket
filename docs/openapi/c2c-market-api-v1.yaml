        deliveryKind:
          type: string
          enum: [api_key_endpoint, login_account]
        apiBaseUrl:
          type: string
          format: uri
        apiKey:
          type: string
          description: Buyer/seller detail and action responses only.
        panelLoginUrl:
          type: string
          format: uri
        username:
          type: string
        password:
          type: string
          description: Buyer/seller detail and action responses only.
        instructions:
          type: string
        submittedAt:
          type: string
          format: date-time
