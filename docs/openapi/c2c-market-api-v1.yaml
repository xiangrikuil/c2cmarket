          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    APIAccountPaymentSettings:
      type: object
      additionalProperties: false
      required:
        - paymentWindowMinutes
        - paymentOptions
        - updatedAt
      properties:
        paymentWindowMinutes:
          type: integer
          enum: [10]
          description: Buyer payment-confirmation window. Account-level API payment settings always use ten minutes.
        paymentOptions:
          type: array
          minItems: 2
          maxItems: 2
          description: Normalized WeChat Pay and Alipay settings. At most one option is enabled.
          items:
            $ref: "#/components/schemas/APIAccountPaymentOption"
        updatedAt:
          type: string
          description: RFC 3339 timestamp of the latest saved option, or an empty string when no account payment setting has been saved.
    UpdateAPIAccountPaymentSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - paymentWindowMinutes
        - paymentOptions
      properties:
        paymentWindowMinutes:
          type: integer
          enum: [10]
        paymentOptions:
          type: array
          minItems: 1
          maxItems: 2
          description: WeChat Pay and/or Alipay settings with exactly one enabled option. Payment methods must be unique.
          items:
            $ref: "#/components/schemas/APIAccountPaymentOption"
    APIAccountPaymentOption:
      type: object
      additionalProperties: false
      required:
        - paymentMethod
        - enabled
        - paymentInstructions
      properties:
        paymentMethod:
          type: string
          enum: [wechat, alipay]
        enabled:
          type: boolean
        paymentInstructions:
          type: string
          maxLength: 160
          description: Optional private note shown only in the order payment-confirmation flow. It must not contain credentials or delivery secrets.
        paymentQrCodeDataUrl:
          type: string
          description: Private WeChat Pay or Alipay QR-code data URL. The enabled option requires this value; public API service reads never expose it.
    APIServiceOrderSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        acceptingOrders:
          type: boolean
          description: Owner's explicit manual willingness to accept API orders. The server still derives isOrderable from current service state.
        paymentWindowMinutes:
          type: integer
          minimum: 3
          maximum: 15
          default: 10
        paymentOptions:
          type: array
          items:
            $ref: "#/components/schemas/APIServicePaymentOptionInput"
    APIServiceProbeConnectionRequest:
      type: object
      additionalProperties: false
      required: [probeConnectionId]
      properties:
        probeConnectionId:
          type: string
          description: Reusable connection UUID, or an empty string to unbind the service.
    APIServicePaymentOptionInput:
      type: object
      additionalProperties: false
      required: [paymentMethod]
      properties:
        paymentMethod:
          type: string
          enum: [wechat, alipay]
        enabled:
          type: boolean
          default: true
        paymentInstructions:
          type: string
          description: Optional private payment note shown only after an API order is created. Must not contain credentials or delivery secrets.
        paymentQrCodeDataUrl:
          type: string
          description: Owner/admin-only WeChat or Alipay QR-code data URL. Enabled WeChat/Alipay options require this field; public API service reads must never expose it.
    APIServicePaymentOption:
      type: object
      additionalProperties: false
      required: [paymentMethod, enabled]
      properties:
        id:
          type: string
          format: uuid
        paymentMethod:
          type: string
          enum: [wechat, alipay]
        enabled:
          type: boolean
        paymentInstructions:
          type: string
          description: Owner/admin view only. Public API service reads must never expose this value.
        paymentQrCodeDataUrl:
          type: string
          description: Owner/admin view only. Public API service reads must never expose this value; API order payment-instruction reads return the frozen snapshot to the buyer.
        version:
          type: integer
    PublicAPIService:
      type: object
      required:
        - id
        - merchantIdentityMode
        - title
        - shortDescription
        - distributionSystem
        - billingMode
        - quotaUsagePolicy
        - healthSummary
        - minimumIntentCny
        - usageVisibility
        - accountPoolType
        - accountPoolLabel
        - merchantRefundCommitment
        - merchantRefundPolicyVersion
        - promptAuditEnabled
        - probeReady
        - acceptingOrders
        - paymentWindowMinutes
        - acceptedPaymentMethods
        - isOrderable
        - accessModes
        - models
        - packages
        - sellerReputation
        - sourceAuthorVerification
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        merchantIdentityMode:
          type: string
          enum: [public_profile, store_alias]
        merchantDisplayName:
          type: string
          description: Public non-sensitive merchant display name. For store-alias services this is the linked merchant profile display name, not the owner username.
        merchantProfileSlug:
          type: string
          description: Public merchant profile slug for store-alias services. Public responses must not expose owner user ID.
        merchantAvatarUrl:
          type: string
          format: uri
          description: Public merchant avatar URL selected by the merchant profile or public identity.
        title:
          type: string
        shortDescription:
          type: string
        sourceUrl:
          type: string
          format: uri
          description: Optional linux.do topic URL used as a public trust signal.
        distributionSystem:
          type: string
          enum: [sub2api, new_api_proxy, other]
        billingMode:
          type: string
          enum: [metered_usd_quota, manual_usage_check, fixed_package]
        declaredCnyPerUsdAllowance:
          $ref: "#/components/schemas/DecimalString"
        declaredMaxUsdAllowancePerIntent:
          $ref: "#/components/schemas/DecimalString"
        availableUsdAllowance:
          $ref: "#/components/schemas/DecimalString"
          description: Current service-wide USD allowance available after pending-order reservations and completed sales.
        quotaExpiresAt:
          type: string
          format: date-time
          description: Fixed expiration timestamp for the currently listed metered quota.
        quotaUsagePolicy:
          $ref: "#/components/schemas/QuotaUsagePolicy"
        healthSummary:
          $ref: "#/components/schemas/ServiceHealthSummary"
        minimumIntentCny:
          $ref: "#/components/schemas/DecimalString"
        maximumIntentCny:
          $ref: "#/components/schemas/DecimalString"
        usageVisibility:
          type: string
          enum: [none, merchant_reported, offsite_panel_readonly, fixed_package_only]
        publicAccessNote:
          type: string
        merchantSupportNote:
          type: string
          description: Server-generated summary of the seller's structured refund choice. C2CMarket records the promise but does not escrow, fund, execute, or guarantee refunds.
        accountPoolType:
          type: [string, "null"]
          enum: [gpt_pro_20x, gpt_pro_5x, gpt_plus, custom, null]
          description: Null only for historical services that have not yet been revised.
        accountPoolLabel:
          type: [string, "null"]
          description: Resolved public account-pool label, including a merchant-entered label when accountPoolType is custom; null with a historical null pool.
        merchantRefundCommitment:
          type: boolean
        merchantRefundPolicyVersion:
          type: string
          enum: [api-merchant-refund-v1]
        declaredMaxConcurrency:
          type: integer
          minimum: 1
        promptAuditEnabled:
          type: [boolean, "null"]
          description: Seller prompt-audit declaration. Null means a historical service has not been revised to declare either state.
        acceptingOrders:
          type: boolean
          description: Owner's manual accepting-orders flag. This is not sufficient by itself; clients must use isOrderable for order creation.
        paymentWindowMinutes:
          type: integer
          minimum: 3
          maximum: 15
        acceptedPaymentMethods:
          type: array
          description: Public labels for enabled payment methods. Does not include account numbers, wallet addresses, or private instructions.
          items:
            type: string
            enum: [wechat, alipay]
        isOrderable:
          type: boolean
          description: Server-derived current orderability.
        orderableReasons:
          type: array
          description: Non-sensitive reasons when a direct detail page is visible but cannot create an order.
          items:
            type: string
        accessModes:
          type: array
          items:
            $ref: "#/components/schemas/APIServiceAccessMode"
        models:
          type: array
          items:
            $ref: "#/components/schemas/APIServiceModel"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/APIServicePackage"
        completed30d:
          type: integer
          minimum: 0
          description: Completed API orders in the previous 30 days.
        unresolvedDisputes:
          type: integer
          minimum: 0
        responseMedianMinutes:
          type: [number, "null"]
          minimum: 0
          description: Median minutes to the first seller response event. Null means there is not enough history.
        sellerReputation:
          anyOf:
            - $ref: "#/components/schemas/ReputationSummary"
            - type: "null"
        sourceAuthorVerification:
          $ref: "#/components/schemas/SourceAuthorResourceSummary"
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
