          in: query
          schema:
            type: string
            enum: [all, today, 7d, 30d]
            default: all
        - name: buyerId
          in: query
          schema:
            type: string
            format: uuid
        - name: sellerId
          in: query
          schema:
            type: string
            format: uuid
        - name: serviceId
          in: query
          schema:
            type: string
            format: uuid
        - name: dispute
          in: query
          schema:
            type: string
            enum: [all, active, none]
            default: all
        - name: minAmount
          in: query
          description: Inclusive non-negative CNY amount lower bound.
          schema:
            type: string
            pattern: '^[0-9]+(?:\.[0-9]+)?$'
        - name: maxAmount
          in: query
          description: Inclusive non-negative CNY amount upper bound.
          schema:
            type: string
            pattern: '^[0-9]+(?:\.[0-9]+)?$'
