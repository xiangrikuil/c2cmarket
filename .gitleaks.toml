title = "C2CMarket Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Browser mock storage keys are identifiers, not credentials."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''frontend/src/lib/api\.ts$''',
  '''frontend/src/mocks/demand\.ts$''',
]
regexes = [
  '''const\s+[A-Za-z0-9]+StorageKey\s*=\s*['"]c2cmarket\.[A-Za-z0-9.]+['"]''',
]

[[allowlists]]
description = "Authentication unit tests compare fixed legacy hash fixtures."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''backend/internal/module/auth/service_test\.go$''',
]
regexes = [
  '''repo\.credential\.Hash\s*==\s*"[a-f0-9]+"''',
]

[[allowlists]]
description = "The frontend API order-number alphabet is a public identifier format."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''frontend/src/lib/api\.ts$''',
]
regexes = [
  '''^const apiOrderNumberAlphabet = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'$''',
]

[[allowlists]]
description = "API order-number test fixtures are public business identifiers."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''backend/internal/store/postgres/api_order_number_test\.go$''',
]
regexes = [
  '''API-[0-9]{8}-[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{10}''',
]
