services:
  postgres:
    restart: always
    ports: !reset []

  minio:
    ports: !reset []

  backend:
    build: !reset null
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    profiles:
      - app
    restart: always
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    environment:
      APP_ENV: production
      ENABLE_DEV_AUTH: "false"
      SENTRY_ENABLED: ${SENTRY_ENABLED:-true}
      SENTRY_DSN: ${SENTRY_DSN:-https://90dd1e33a789a0935b8d8ca4ef2ab319@o4511896757010432.ingest.us.sentry.io/4511896765726720}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-30m}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-5m}
      DB_HEALTH_CHECK_PERIOD: ${DB_HEALTH_CHECK_PERIOD:-1m}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-15s}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-5s}
      DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT: ${DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT:-30s}
      DB_SLOW_QUERY_THRESHOLD: ${DB_SLOW_QUERY_THRESHOLD:-1s}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?TURNSTILE_SECRET is required}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:?TURNSTILE_HOSTNAMES is required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_X_FORWARDED_FOR: ${TRUST_X_FORWARDED_FOR:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MODEL_AUDIT_ALLOWED_HOSTS: ${MODEL_AUDIT_ALLOWED_HOSTS:-}
      OAUTH_PROVIDER_MODE: oauth2
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?OAUTH_CLIENT_ID is required}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?OAUTH_CLIENT_SECRET is required}
      OAUTH_AUTHORIZE_URL: ${OAUTH_AUTHORIZE_URL:?OAUTH_AUTHORIZE_URL is required}
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:?OAUTH_TOKEN_URL is required}
      OAUTH_USERINFO_URL: ${OAUTH_USERINFO_URL:?OAUTH_USERINFO_URL is required}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:?OAUTH_REDIRECT_URL is required}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-openid profile}
      CONTACT_ENCRYPTION_KEY: ${CONTACT_ENCRYPTION_KEY:-}
      CONTACT_FINGERPRINT_KEY: ${CONTACT_FINGERPRINT_KEY:-}
      CONTACT_KEY_VERSION: ${CONTACT_KEY_VERSION:?CONTACT_KEY_VERSION is required}
      CONTACT_ENCRYPTION_KEYRING: ${CONTACT_ENCRYPTION_KEYRING:-}
      CONTACT_FINGERPRINT_KEYRING: ${CONTACT_FINGERPRINT_KEYRING:-}
      EMAIL_VERIFICATION_PEPPER: ${EMAIL_VERIFICATION_PEPPER:?EMAIL_VERIFICATION_PEPPER is required}
      C2C_BOOTSTRAP_ADMIN_USERNAME: ${C2C_BOOTSTRAP_ADMIN_USERNAME:-}
      C2C_BOOTSTRAP_ADMIN_PASSWORD: ${C2C_BOOTSTRAP_ADMIN_PASSWORD:-}
      EMAIL_PROVIDER: aliyun_directmail
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is required}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-C2CMarket}
